# CleanROMs - integracion continua
#
# En cada push y pull request:
#   1. Comprueba que todos los .ps1 tienen sintaxis valida, que los
#      archivos que se cargan con ". $Root\..." existen con la
#      MAYUSCULA/minuscula exacta (en Linux "Logger.ps1" y "logger.ps1"
#      son archivos distintos) y que los .json son validos.
#   2. Ejecuta la suite de tests completa.
#   3. Hace una prueba de humo del modo desatendido (-Action ... -Yes):
#      no se queda colgado y devuelve el codigo de salida correcto.
#
# Se ejecuta en Windows (el entorno real de RetroBat) y en Linux (detecta
# problemas de mayusculas/minusculas y rutas).

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Version de PowerShell
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()

      - name: Comprobar el proyecto (sintaxis, rutas, JSON)
        shell: pwsh
        run: ./Tests/Check-Project.ps1

      - name: Suite de tests
        shell: pwsh
        run: ./Tests/Run-AllTests.ps1

      - name: Prueba de humo del modo desatendido
        shell: pwsh
        run: ./Tests/Smoke-Unattended.ps1
